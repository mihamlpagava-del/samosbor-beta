name: Deploy to VK Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Deploy to VK Mini Apps
        uses: vkontakte/vk-miniapps-deploy-action@v1
        with:
          app-id: ${{ secrets.VK_APP_ID }}
          access-token: ${{ secrets.VK_ACCESS_TOKEN }}
